<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Inspired</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        color: #111;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 16px;
      }
      p {
        font-size: 1.125rem;
        line-height: 1.6;
        color: #444;
      }
      .hero {
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
        padding: 48px;
      }
      .button {
        display: inline-block;
        margin-top: 32px;
        padding: 14px 28px;
        border-radius: 20px;
        background: #0071e3;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>Apple Inspired Landing Page</h1>
        <p>Clean layout, simple typography, and a subtle interface designed for modern product showcases.</p>
        <a href="#" class="button">Explore More</a>
      </section>
    </main>
  </body>
</html>
