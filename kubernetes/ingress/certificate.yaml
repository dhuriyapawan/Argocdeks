apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ridesharex-tls
  namespace: rideshare
spec:
  secretName: ridesharex-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - ridesharex.com
  - www.ridesharex.com
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@ridesharex.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
