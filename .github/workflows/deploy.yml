# github actions workflowname: Deploy

on:
  push:
    branches: [devops2]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 878445923420.dkr.ecr.us-east-1.amazonaws.com/eksapple

jobs:
  build:
    runs-on: ubuntu-latest 

    permissions:
      id-token: write
      contents: write

    steps:

    - uses: actions/checkout@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: aws-actions/amazon-ecr-login@v2

    - name: Build
      run: |
        docker build \
           -f docker/Dockerfile \
           -t $ECR_REPOSITORY:${GITHUB_SHA} \

    - name: Push
      run: |
        docker tag $ECR_REPOSITORY:latest \
        ${{ secrets.ECR_URI }}:${{ github.sha }}

        docker push \
        ${{ secrets.ECR_URI }}:${{ github.sha }}

    - name: Update Helm
      run: |
        sed -i \
        "s/tag:.*/tag: ${{ github.sha }}/" \
        helm/apple-site/values.yaml

    - name: Commit
      run: |
        git config user.email "github@actions.com"
        git config user.name "github-actions"

        git add .

        git commit -m "update image"

        git push