name: Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_URI: ${{ secrets.ECR_URI }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          docker build -t $ECR_URI:${{ github.sha }} .

      - name: Push
        run: |
          docker push $ECR_URI:${{ github.sha }}

      - name: Update Helm
        run: |
          sed -i "s|tag: .*|tag: ${{ github.sha }}|" helm/apple-site/values.yaml

      - name: Commit
        run: |
          git config user.email "github@actions.com"
          git config user.name "github-actions"
          git add helm/apple-site/values.yaml
          git commit -m "update image" || true
          git push || true
