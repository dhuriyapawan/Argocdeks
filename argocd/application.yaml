apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: login-app
  namespace: argocd

spec:
  project: login

  source:
    repoURL: https://github.com/dhuriyapawan/Argocdeks.git
    targetRevision: devops5
    path: charts

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  syncOptions:
      - CreateNamespace=true