apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: login-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dhuriyapawan/Argocdeks.git
    targetRevision: HEAD
    path: charts/login-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true