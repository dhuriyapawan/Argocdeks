# argocd applicationapiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: apple-site

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/StaticWebK8s.git

    targetRevision: main

    path: helm/apple-site

  destination:
    server: https://kubernetes.default.svc

    namespace: apple-site

  syncPolicy:
    automated:
      prune: true
      selfHeal: true