apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd
spec:
  project: rideshare-project
  source:
    repoURL: https://github.com/your-org/ridesharex.git
    targetRevision: HEAD
    path: helm/frontend
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rideshare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
